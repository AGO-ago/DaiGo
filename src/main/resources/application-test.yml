# 测试环境
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ZHAO_DB_HOST}:${ZHAO_DB_PORT:3306}/${ZHAO_DB_NAME:zhao_waimai_test}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
