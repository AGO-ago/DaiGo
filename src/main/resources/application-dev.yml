# 本地开发环境
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ZHAO_DB_HOST:localhost}:${ZHAO_DB_PORT:3306}/${ZHAO_DB_NAME:zhao_waimai_dev}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${ZHAO_DB_USER:root}
    password: ${ZHAO_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${ZHAO_REDIS_HOST:localhost}
      port: ${ZHAO_REDIS_PORT:6379}
      database: ${ZHAO_REDIS_DB:0}
      password: ${ZHAO_REDIS_PASSWORD:}
      timeout: 3000ms

logging:
  level:
    org.com.first.zhao_waimai: debug
