spring:
  application:
    name: zhao_waimai
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

# MyBatis-Plus 公共配置（各环境共用）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档（Knife4j）：访问 /api/doc.html
springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn

# 业务自定义配置（密钥/密码只在 local 或环境变量，禁止明文提交）
zhao-waimai:
  jwt:
    secret: ${ZHAO_JWT_SECRET:CHANGE_ME_AT_LEAST_32_BYTES_PLACEHOLDER_SECRET}
    expire-seconds: 7200
  wx:
    appid: ${ZHAO_WX_APPID:}
    secret: ${ZHAO_WX_APP_SECRET:}
    mock-enabled: false
  upload:
    dir: ${ZHAO_UPLOAD_DIR:./uploads}
    allow-exts: jpg,jpeg,png,webp,gif
